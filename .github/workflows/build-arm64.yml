name: build-arm64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The windows-2022 runner ships the MSVC v143 ARM64 build tools and a
      # Windows SDK. Ensure the SDK version the project targets is present.
      - name: Install Windows SDK 10.0.19041
        uses: microsoft/windows-sdk-action@v1
        with:
          sdk-version: 10.0.19041.0

      - name: Build Release ARM64
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release -Platform ARM64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neomobileshell-arm64
          path: out/Release-ARM64/
          if-no-files-found: error
