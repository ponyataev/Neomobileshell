name: build-arm64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-2022 ships MSVC v143 (with ARM64 tools) and multiple Windows
      # SDKs preinstalled, so no extra setup is needed here.

      - name: Build Release ARM64
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release -Platform ARM64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neomobileshell-arm64
          path: out/Release-ARM64/
          if-no-files-found: error
